name: Fetch KF141R-2.54 reference family

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-kf141r-reference.yml"
      - "scripts/fetch_lcsc_reference.py"
      - "scripts/analyze_step.py"
      - "scripts/section_step_xy.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CadQuery
        run: |
          python -m pip install --upgrade pip
          pip install "cadquery>=2.5"
      - name: Fetch exact EasyEDA STEP family
        run: |
          set -e
          for spec in \
            "2 C475124" \
            "3 C475125" \
            "4 C475126" \
            "5 C475127" \
            "6 C475128" \
            "7 C475129" \
            "8 C475130" \
            "9 C475131" \
            "10 C475132"
          do
            set -- $spec
            P=$1
            ID=$2
            STEP="reference_models/KF141R-2.54/KF141R-2.54-${P}P_${ID}.step"
            META="reference_models/KF141R-2.54/KF141R-2.54-${P}P_${ID}.analysis.json"
            python scripts/fetch_lcsc_reference.py "$ID" "$STEP"
            python scripts/analyze_step.py "$STEP" "$META"
          done
          python scripts/section_step_xy.py reference_models/KF141R-2.54/KF141R-2.54-10P_C475132.step reference_models/KF141R-2.54/C475132_z-3.section_xy.json -3
          python scripts/section_step_xy.py reference_models/KF141R-2.54/KF141R-2.54-10P_C475132.step reference_models/KF141R-2.54/C475132_z-1.section_xy.json -1
      - name: Commit reference family
        run: |
          git config user.name "3D Model Altium Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reference_models/KF141R-2.54
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "reference: add exact KF141R-2.54 2P-10P STEP family"
            git pull --rebase origin main
            git push origin main
          fi
