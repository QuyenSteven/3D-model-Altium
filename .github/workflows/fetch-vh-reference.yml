name: Fetch LCSC VH reference models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_lcsc_reference.py"
      - "scripts/analyze_step.py"
      - "scripts/section_step.py"
      - ".github/workflows/fetch-vh-reference.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CadQuery for validation
        run: |
          python -m pip install --upgrade pip
          pip install "cadquery>=2.5"

      - name: Fetch original EasyEDA STEP family
        run: |
          set -e
          for spec in \
            "2 C5379868" \
            "3 C5379869" \
            "4 C5379870" \
            "5 C5379871" \
            "6 C5379872" \
            "7 C5379873" \
            "8 C5379874" \
            "9 C5379875" \
            "10 C5379876"
          do
            set -- $spec
            PINS=$1
            ID=$2
            STEP="reference_models/VH3.96/SHOU_HAN/VH3.96-${PINS}P_ZZ_${ID}.step"
            META="reference_models/VH3.96/SHOU_HAN/VH3.96-${PINS}P_ZZ_${ID}.analysis.json"
            python scripts/fetch_lcsc_reference.py "$ID" "$STEP"
            python scripts/analyze_step.py "$STEP" "$META"
            if [ "$PINS" = "4" ]; then
              python scripts/section_step.py "$STEP" "reference_models/VH3.96/SHOU_HAN/VH3.96-4P_ZZ_C5379870.section_yz.json" 0
            fi
          done

      - name: Commit reference models
        run: |
          git config user.name "3D Model Altium Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reference_models/VH3.96
          if git diff --cached --quiet; then
            echo "No reference-model changes."
          else
            git commit -m "reference: fetch exact SHOU HAN VH3.96 STEP family"
            git pull --rebase origin main
            git push origin main
          fi
